name: Uppdatera data (dagligen)

# Hämtar från Brickset EN gång per dygn och publicerar en färdig fil som alla
# appar läser via CDN. Lägg in nyckeln som repo-secret BRICKSET_API_KEY.

on:
  schedule:
    - cron: '17 4 * * *'   # varje natt 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main, master, 'claude/**']
    paths: ['scripts/build-feed.mjs', 'public/js/retiring.js', '.github/workflows/data.yml']

permissions:
  contents: write

concurrency:
  group: data-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Hämta förra filen (behåll växelkurser om Frankfurter är nere)
        run: |
          mkdir -p feed
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/retiring.json" -o feed/retiring.json || rm -f feed/retiring.json

      - name: Bygg feed/retiring.json
        env:
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
        run: node scripts/build-feed.mjs

      - name: Publicera till grenen "data"
        run: |
          cd feed
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retiring.json
          git commit -q -m "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Töm CDN-cachen (jsDelivr)
        run: curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/retiring.json" || true
