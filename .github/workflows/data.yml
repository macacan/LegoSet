name: Uppdatera data (dagligen)

# Hämtar från Brickset EN gång per dygn och publicerar en färdig fil som alla
# appar läser via CDN. Lägg in nyckeln som repo-secret BRICKSET_API_KEY.

on:
  schedule:
    - cron: '17 4 * * *'   # varje natt 04:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Hämta från Brickset även om datan är färsk (använder ~10 av 100 dagliga anrop)'
        type: boolean
        default: false
  push:
    branches: [main, master, 'claude/**']
    paths: ['scripts/build-feed.mjs', 'scripts/build-catalog.mjs', 'public/js/retiring.js', '.github/workflows/data.yml']

permissions:
  contents: write

concurrency:
  group: data-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Hämta förra filerna (behålls om en källa är nere)
        run: |
          mkdir -p feed
          for f in retiring.json catalog.json; do
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/$f" -o "feed/$f" || rm -f "feed/$f"
          done

      - name: Bygg feed/retiring.json
        env:
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: node scripts/build-feed.mjs

      - name: Bygg feed/catalog.json (alla set, från Rebrickable)
        run: node scripts/build-catalog.mjs

      - name: Publicera till grenen "data"
        run: |
          cd feed
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retiring.json catalog.json
          git commit -q -m "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Töm CDN-cachen (jsDelivr)
        run: |
          for f in retiring.json catalog.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/$f" || true
          done
